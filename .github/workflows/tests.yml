name: V1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, gd
          coverage: none
      - run: find . -name '*.php' -not -path './storage/state.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/unit.php
      - run: php tests/storage.php
      - if: matrix.php == '8.4'
        run: php -d memory_limit=512M tests/storage-performance.php
      - run: php tests/sessions.php
      - run: php tests/import.php
      - run: php tests/google.php
      - run: php tests/openai-images.php
      - run: python3 tests/integration.py
      - run: python3 tests/google-http.py
      - run: python3 tests/openai-http.py
  browser:
    # Playwright 1.58 uses Ubuntu 24.04 browser/dependency builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 ships PHP 8.3 CGI. Install it before setup-php selects CLI 8.2.
      - name: Install Apache and native PHP-CGI for copy deployment checks
        run: sudo apt-get update && sudo apt-get install -y apache2 php8.3-cgi php8.3-curl php8.3-gd php8.3-xml php8.3-mbstring
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 axe-core@4.11.1
      - run: npx playwright install --with-deps chromium
      - name: Browser migration with real .htaccess protection
        run: python3 tests/web-migration.py
        env:
          PHP_CGI_BIN: /usr/bin/php-cgi8.3
          MYWISH_WEB_MIGRATION_BROWSER: '1'
      - run: node tests/browser.cjs
      - run: node tests/install-banner.cjs
      - run: node tests/google-browser.cjs
      - run: node tests/openai-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: tests/.artifacts/
